name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile journal_core.py scripts/core_smoke_test.py journal_tui.py scripts/tui_smoke_test.py

      - name: Core smoke test (headless)
        run: |
          python scripts/core_smoke_test.py

      - name: TUI smoke test (headless)
        run: |
          python scripts/tui_smoke_test.py
