name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (Tkinter GUI)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb libenchant-2-2 hunspell-en-us

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile journal_core.py scripts/core_smoke_test.py journal_tui.py scripts/tui_smoke_test.py omarchy_theme.py scripts/omarchy_theme_smoke_test.py secure_journal.py scripts/smoke_test.py

      - name: Core smoke test (headless)
        run: |
          python scripts/core_smoke_test.py

      - name: TUI smoke test (headless)
        run: |
          python scripts/tui_smoke_test.py

      - name: Omarchy theme smoke test (headless)
        run: |
          python scripts/omarchy_theme_smoke_test.py

      - name: GUI smoke test (Xvfb)
        run: |
          xvfb-run -a python scripts/smoke_test.py
