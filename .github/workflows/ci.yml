name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb libenchant-2-2 hunspell-en-us

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m py_compile secure_journal.py scripts/smoke_test.py

      - name: Smoke test (Tkinter under Xvfb)
        run: |
          xvfb-run -a python scripts/smoke_test.py
